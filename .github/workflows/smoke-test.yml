name: smoke-test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone related repositories
        run: |
          git clone --depth 1 https://github.com/yuu-eguci/flower-stuff-easy-web-vue.git ./app/flower-stuff-easy-web-vue
          git clone --depth 1 https://github.com/yuu-eguci/flower-stuff-easy-web-django.git ./app/flower-stuff-easy-web-django

      - run: ./scripts/smoke-test.sh

      - if: always()
        run: docker compose down
